    <circle cx="940" cy="154" r="4" fill="#55E6D0"/>
    <circle cx="1030" cy="198" r="4" fill="#55E6D0"/>
  </g>
  <g transform="translate(930 72)" fill="none" stroke="#55E6D0">
    <circle cx="110" cy="105" r="83" stroke-opacity=".15" stroke-width="1"/>
    <circle cx="110" cy="105" r="61" stroke-opacity=".38" stroke-width="1" stroke-dasharray="3 7"/>
    <circle cx="110" cy="105" r="35" stroke-opacity=".65" stroke-width="1.5"/>
