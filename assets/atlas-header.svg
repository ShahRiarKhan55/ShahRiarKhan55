<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Scientific Atlas — K. M. Shahriar Alam Adib</title>
  <desc id="desc">An editorial scientific field-notes banner in ivory, forest ink, terracotta, sage, and antique brass.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#87917A" stroke-opacity=".18" stroke-width="1"/></pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7F1E5"/><stop offset="1" stop-color="#EDE3D0"/></linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#C45A3A" stop-opacity=".13"/><stop offset="1" stop-color="#C45A3A" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1200" height="330" rx="18" fill="url(#paper)"/>
  <rect width="1200" height="330" rx="18" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="330" rx="18" fill="url(#wash)"/>
  <path d="M0 265 C140 230 210 280 330 252 S520 220 650 260 S900 286 1200 230 V330 H0Z" fill="#202923"/>
  <path d="M0 282 C170 248 240 292 390 270 S620 242 760 278 S1000 290 1200 255" fill="none" stroke="#87917A" stroke-width="2" opacity=".75"/>
  <path d="M70 50 A84 84 0 0 1 238 50" fill="none" stroke="#C45A3A" stroke-width="9" stroke-linecap="round"/>
  <path d="M70 50 A84 84 0 0 0 238 50" fill="none" stroke="#C45A3A" stroke-width="2" stroke-dasharray="4 8" opacity=".8"/>
  <text x="154" y="145" text-anchor="middle" font-family="Georgia,serif" font-size="92" font-style="italic" font-weight="bold" fill="#202923">SA</text>
  <text x="300" y="91" font-family="Georgia,serif" font-size="43" font-weight="bold" fill="#202923">K. M. Shahriar Alam Adib</text>
  <text x="304" y="130" font-family="Arial,sans-serif" font-size="15" letter-spacing="4" font-weight="bold" fill="#C45A3A">RESEARCHER  /  ENGINEER  /  TECHNOLOGY BUILDER</text>
  <path d="M304 153H1090" stroke="#87917A" stroke-width="1.5"/>
  <text x="304" y="190" font-family="Georgia,serif" font-size="22" fill="#202923">MSc Student · Shimane University · Japan</text>
  <text x="304" y="232" font-family="Georgia,serif" font-size="27" font-style="italic" fill="#202923">Research the unknown. Engineer what’s next.</text>
