<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">K. M. Shahriar Alam Adib — Research Engineer</title>
  <desc id="desc">A custom graphite and cyan technical profile banner with a signal-trace motif and research grid.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
