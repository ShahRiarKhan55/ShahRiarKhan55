  <text x="42" y="305" font-family="Arial,sans-serif" font-size="11" letter-spacing="3" fill="#F2EBDD">FIELD NOTES / 2026</text>
  <text x="1155" y="305" text-anchor="end" font-family="Arial,sans-serif" font-size="11" letter-spacing="2" fill="#F2EBDD">SHIMANE, JAPAN</text>
