    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111820"/>
      <stop offset=".58" stop-color="#1B2731"/>
      <stop offset="1" stop-color="#10171E"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55E6D0" stop-opacity="0"/>
      <stop offset=".5" stop-color="#55E6D0" stop-opacity=".9"/>
      <stop offset="1" stop-color="#55E6D0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>
  <path d="M0 300H1200" stroke="#55E6D0" stroke-opacity=".18"/>
  <path d="M0 304H1200" stroke="url(#beam)" stroke-width="2"/>
  <g fill="none" stroke="#55E6D0" stroke-width="1.5" opacity=".65">
    <path d="M790 0V68H860V112H940V154H1030V198H1200"/>
    <path d="M850 0V38H910V80H990V122H1080V164H1200" opacity=".5"/>
    <path d="M920 360V290H980V252H1050V216H1120V180H1200" opacity=".45"/>
